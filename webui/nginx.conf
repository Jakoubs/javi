server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback – send all non-asset requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        resolver           127.0.0.11 valid=5s ipv6=off;
        set $rest_url      http://rest:8080;
        proxy_pass         $rest_url;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /tournament-api/api/ {
        rewrite ^/tournament-api/api/(.*) /api/$1 break;
        proxy_pass         __TOURNAMENT_URL__;
        proxy_http_version 1.1;
        proxy_set_header   Host              __TOURNAMENT_HOST__;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        proxy_ssl_server_name on;
        proxy_read_timeout 600s; # Long timeout for streaming
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
    }
}

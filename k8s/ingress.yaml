apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: javi
  namespace: javi
  labels:
    app.kubernetes.io/name: javi
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: javi-strip-tournament@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /tournament-api
            pathType: Prefix
            backend:
              service:
                name: tournament-external
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: rest
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webui
                port:
                  name: http
---
# Strip /tournament-api prefix before forwarding to the external service
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-tournament
  namespace: javi
spec:
  stripPrefix:
    prefixes:
      - /tournament-api

apiVersion: v1
kind: Secret
metadata:
  name: lichess-secret
  namespace: javi
  labels:
    app.kubernetes.io/name: javi
    app.kubernetes.io/component: lichess
type: Opaque
stringData:
  # Replace with your actual Lichess bot token before deploying:
  #   kubectl create secret generic lichess-secret -n javi \
  #     --from-literal=lichess-token=lip_xxxxxxxxxxxx \
  #     --from-literal=tournament-bot-token=eyJxxx \
  #     --from-literal=tournament-bot-name=javi-bot \
  #     --dry-run=client -o yaml | kubectl apply -f -
  lichess-token: "REPLACE_ME"
  # Bot JWT for the external tournament API (maichess.berger-software.com)
  # Leave empty to let the REST service auto-register on first bot-join request
  tournament-bot-token: ""
  # Display name used when auto-registering on the tournament server
  tournament-bot-name: "javi-bot"

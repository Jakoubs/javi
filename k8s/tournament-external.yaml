# Manual Endpoints pointing to the tournament server at 141.37.74.152:8086
apiVersion: v1
kind: Endpoints
metadata:
  name: tournament-external
  namespace: javi
subsets:
  - addresses:
      - ip: 141.37.74.152
    ports:
      - name: http
        port: 8086
        protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: tournament-external
  namespace: javi
  labels:
    app.kubernetes.io/name: javi
    app.kubernetes.io/component: tournament-proxy
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8086
      targetPort: 8086
      protocol: TCP

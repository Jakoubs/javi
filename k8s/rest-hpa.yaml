apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rest
  namespace: javi
  labels:
    app.kubernetes.io/name: javi
    app.kubernetes.io/component: rest
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rest
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

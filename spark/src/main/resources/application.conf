# ── Chess Spark Analytics Configuration ────────────────────────────────────────
# Values can be overridden via environment variables (see ${?...} fallbacks).

chess-spark {

  # ── Postgres JDBC ──────────────────────────────────────────────────────────
  db {
    url      = "jdbc:postgresql://localhost:5433/chess"
    url      = ${?DB_URL}
    user     = "chess"
    user     = ${?DB_USER}
    password = "chess"
    password = ${?DB_PASS}
    driver   = "org.postgresql.Driver"
  }

  # ── Kafka ──────────────────────────────────────────────────────────────────
  kafka {
    bootstrap-servers = "localhost:9092"
    bootstrap-servers = ${?KAFKA_BOOTSTRAP}
    topics {
      game-reports = "chess-game-reports"
      moves        = "chess-moves"
      evaluations  = "chess-evaluations"
    }
  }

  # ── File-based input ───────────────────────────────────────────────────────
  files {
    enable-puzzle = false
    enable-puzzle = ${?ENABLE_PUZZLE_ANALYSIS}
    puzzle-csv = "lichess_db_puzzle.csv"
    puzzle-csv = ${?PUZZLE_CSV_PATH}
  }

  # ── Output ─────────────────────────────────────────────────────────────────
  output {
    json-dir = "spark-output"
    json-dir = ${?SPARK_OUTPUT_DIR}
    # Analytics results table in Postgres
    analytics-table = "spark_analytics"
  }
}
